services:
    hande_noetic_ws:
        build:
            context: "docker"
            dockerfile: "Dockerfile"
        container_name: hande_noetic_container
        environment:
            - DISPLAY=$DISPLAY
            - QT_X11_NO_MITSHM=1
            - ROS_HOSTNAME=localhost
        volumes:
            - /dev:/dev
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ./catkin_ws/noetic/src:/catkin_ws/src
        privileged: true
        tty: true
        network_mode: host
        command: bash -c "source /opt/ros/noetic/setup.bash && cd /catkin_ws && catkin build -DPYTHON_EXECUTABLE=/usr/bin/python3 && bash"