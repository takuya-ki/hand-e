services:
    hande_humble_ws:
        build:
            context: "docker"
            dockerfile: "Dockerfile"
        container_name: hande_humble_container
        environment:
            - DISPLAY=$DISPLAY
            - QT_X11_NO_MITSHM=1
            - ROS_HOSTNAME=localhost
            - IGN_GAZEBO_RESOURCE_PATH=/ros2_ws/install/hande_description/share
            - GZ_SIM_RESOURCE_PATH=/ros2_ws/install/hande_description/share
        volumes:
            - /dev:/dev
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ./ros2_ws/humble/src:/ros2_ws/src
        devices:
            - /dev/dri:/dev/dri
        privileged: true
        tty: true
        network_mode: host
        command: bash -c "source /opt/ros/humble/setup.bash && colcon build --symlink-install --executor sequential && bash"
