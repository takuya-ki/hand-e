controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      publish_rate: 50

    hande_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters: {}

hande_controller:
  ros__parameters:
    joints:
      - hande_left_finger_joint
      - hande_right_finger_joint
    command_interfaces:
      - position